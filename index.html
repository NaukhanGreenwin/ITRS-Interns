<!doctype html>
<html lang="en-CA">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="referrer" content="no-referrer">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src data:; connect-src https://login.microsoftonline.com https://itrs-form-relay.onrender.com; base-uri 'none'; form-action 'none'">
<meta name="theme-color" content="#F7F4EE">
<title>Intern Programme | IT Rapid Support</title>
<style>/* IT Rapid Support Intern Programme - Swiss private-bank house style */
:root{
  --paper:#F7F4EE; --white:#FDFCF9; --ink:#141414; --ink2:#3B3A37; --muted:#6F6B63; --faint:#9C978D;
  --item:#5E5B54; --rule:#E5E0D6; --rule2:#D5CEC1; --accent:#1E3B2F;
  --serif:"Iowan Old Style","Palatino Linotype",Palatino,"Book Antiqua",Georgia,serif;
  --sans:-apple-system,BlinkMacSystemFont,"Helvetica Neue",Helvetica,Arial,sans-serif;
  --mono:"SF Mono",Menlo,Consolas,monospace;
  --max:1120px; --pad:clamp(20px,5vw,56px);
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;scroll-behavior:smooth;scroll-padding-top:128px}
body{margin:0;background:var(--paper);color:var(--ink2);font:15px/1.6 var(--sans);
  font-variant-numeric:tabular-nums lining-nums;-webkit-font-smoothing:antialiased}
a{color:var(--ink);text-decoration:none;border-bottom:1px solid var(--rule2);transition:border-color .15s,color .15s}
a:hover{border-bottom-color:var(--ink)}
a:focus-visible,button:focus-visible,input:focus-visible,summary:focus-visible{outline:1px solid var(--accent);outline-offset:3px}
h1,h2,h3{font-family:var(--serif);font-weight:400;color:var(--ink);margin:0;letter-spacing:0}
p{margin:0 0 1em}
code{font:12.5px var(--mono);color:var(--ink)}
.eyebrow,.k,.lbl,.mast-lbl,dt,.m,.role,.cur,.st{font:600 10.5px/1.4 var(--sans);letter-spacing:.14em;text-transform:uppercase}
.eyebrow{color:var(--accent);margin:0 0 18px}
.acc{color:var(--accent)} .ink{color:var(--ink)} .faint{color:var(--faint)}
.tk{width:10px;height:10px;vertical-align:-1px;margin-right:6px;color:var(--accent)}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;min-height:40px;padding:0 18px;
  font:500 12.5px/1 var(--sans);letter-spacing:.06em;color:var(--white);background:var(--ink);
  border:1px solid var(--ink);border-radius:0;cursor:pointer;transition:background .15s,color .15s;white-space:nowrap}
.btn:hover{background:var(--accent);border-color:var(--accent)}
.btn.ghost{background:transparent;color:var(--ink);border-color:var(--rule2)}
.btn.ghost:hover{border-color:var(--ink);background:transparent;color:var(--ink)}
button.link{background:none;border:0;padding:0;font:inherit;color:var(--ink);cursor:pointer;border-bottom:1px solid var(--rule2)}
button.link:hover{border-bottom-color:var(--ink)}

/* ---------- sign-in (SSO only) ---------- */
.gate{min-height:100vh;min-height:100dvh;display:flex;background:var(--paper)}
.gate-in{width:100%;max-width:468px;margin:0 auto;display:flex;flex-direction:column;
  padding:max(24px, calc(env(safe-area-inset-top) + 16px)) max(24px, env(safe-area-inset-right)) calc(env(safe-area-inset-bottom) + 24px) max(24px, env(safe-area-inset-left))}
.gate-main{flex:1;display:flex;flex-direction:column;justify-content:center;text-align:center;padding:16px 0 32px}
.gate-head{display:flex;justify-content:center;padding:0 0 24px;border-bottom:1px solid var(--rule)}
.gate-logo{height:48px;width:auto;display:block}
.gate-body{display:flex;flex-direction:column;align-items:center;padding:36px 0 0}
.gate-body .eyebrow{margin-bottom:14px}
.gate-body h1{font-size:44px;line-height:1.1;margin-bottom:14px}
.gate-body .lede{color:var(--item);margin:0 0 32px}
button.ms{display:flex;align-items:center;justify-content:center;gap:12px;width:100%;height:52px;padding:0 18px;
  font:500 15px/1 var(--sans);letter-spacing:.01em;color:var(--ink);background:var(--white);border:1px solid var(--ink);
  border-radius:0;cursor:pointer;transition:border-color .15s,color .15s;-webkit-appearance:none;appearance:none}
button.ms:hover{border-color:var(--accent);color:var(--accent)}
button.ms:disabled{opacity:.7;cursor:default}
.ms-logo{width:18px;height:18px;flex:none;display:block}
#mserr{margin:12px 0 0}
.err{min-height:1.4em;margin:14px 0 0;font-size:13px;color:#7A2A22}
.gate-foot{display:flex;flex-direction:column;align-items:center;gap:4px;padding:16px 0 0;margin:0 auto;width:100%;border-top:1px solid var(--rule);font-size:11.5px;line-height:1.5;color:var(--faint);text-align:center}

/* ---------- masthead ---------- */
.mast{position:sticky;top:0;z-index:10;background:var(--paper);padding:0 var(--pad)}
.mast-in{max-width:calc(var(--max) - 2 * var(--pad));margin:0 auto;padding:18px 0 16px;display:flex;justify-content:space-between;align-items:center;gap:20px;border-bottom:1px solid var(--ink)}
.logo{height:34px;width:auto;display:block}
.mast-r{display:flex;align-items:baseline;gap:18px;font-size:13px}
.mast-lbl{color:var(--accent)}
.mast-who{font-family:var(--serif);font-size:15px;color:var(--ink)}
.nav{border-bottom:1px solid var(--rule)}
.nav{margin:0 calc(var(--pad) * -1);padding:0 var(--pad)}
.nav-in{max-width:calc(var(--max) - 2 * var(--pad));margin:0 auto;padding:0;display:flex;gap:26px;overflow-x:auto;scrollbar-width:none}
.nav-in::-webkit-scrollbar{display:none}
.nav a{flex:none;border:0;padding:12px 0 11px;font-size:12.5px;color:var(--muted);border-bottom:1px solid transparent;margin-bottom:-1px}
.nav a:hover{color:var(--ink)}
.nav a.on{color:var(--ink);border-bottom-color:var(--ink)}

/* ---------- layout ---------- */
.wrap{max-width:var(--max);margin:0 auto;padding:0 var(--pad)}
.hero{padding:76px 0 0}
.hero h1{font-size:clamp(38px,5.4vw,60px);line-height:1.06;margin-bottom:24px}
.hero .lede{font:19px/1.6 var(--serif);color:var(--ink2);max-width:720px;margin-bottom:28px}
.next{font-size:14px;color:var(--ink);margin:0 0 56px;padding:12px 0;border-top:1px solid var(--rule);border-bottom:1px solid var(--rule)}
.next .k{color:var(--accent);margin-right:12px}
.meta{display:grid;grid-template-columns:repeat(4,1fr);margin:0;border-top:1px solid var(--ink);border-bottom:1px solid var(--rule)}
.meta>div{padding:16px 20px 18px 0}
.meta>div+div{padding-left:20px;border-left:1px solid var(--rule)}
.meta dt{color:var(--muted);margin-bottom:6px}
.meta dd{margin:0;font:16px/1.35 var(--serif);color:var(--ink)}

.sec{padding:88px 0 0}
.sh{display:flex;align-items:baseline;gap:14px;padding-bottom:12px;border-bottom:1px solid var(--rule);margin-bottom:30px}
.sh .num{font:20px var(--serif);color:var(--accent)}
.sh .lbl{color:var(--ink2)}
.sec h2{font-size:clamp(28px,3.4vw,36px);line-height:1.15;margin:0 0 30px;max-width:760px}
.sec h3{font-size:19px;line-height:1.3;margin:0 0 8px}
.num{font-family:var(--serif);color:var(--accent)}
.intro{max-width:760px;color:var(--ink2);margin-bottom:28px}
.note{font-size:13px;color:var(--muted);margin:22px 0 0}

/* brief */
.cols2{display:grid;grid-template-columns:1fr 1fr;gap:56px}
.cols2 p{color:var(--item)}
.cols2 h3+p{margin-bottom:26px}
.scope{margin:0;padding:0;list-style:none;counter-reset:s}
.scope li{counter-increment:s;display:grid;grid-template-columns:34px 1fr;padding:10px 0;border-top:1px solid var(--rule);color:var(--item);font-size:14.5px}
.scope li:last-child{border-bottom:1px solid var(--rule)}
.scope li::before{content:counter(s,decimal-leading-zero);font:14px var(--serif);color:var(--accent)}
.kv{display:grid;grid-template-columns:150px 1fr auto;gap:20px;align-items:start;margin-top:36px;padding:16px 0;border-top:1px solid var(--ink);border-bottom:1px solid var(--rule);font-size:14px;color:var(--item)}
.kv .k{color:var(--muted);padding-top:3px}
.kv .sep{color:var(--faint);margin:0 10px}
.kv:not(.tracker){grid-template-columns:150px 1fr}

/* team */
.team{display:grid;grid-template-columns:repeat(3,1fr);border-top:1px solid var(--ink)}
.person{padding:24px 28px 26px 0;border-bottom:1px solid var(--rule);display:flex;flex-direction:column}
.person:not(:nth-child(3n+1)){padding-left:28px;border-left:1px solid var(--rule)}
.person .role{color:var(--muted);margin:0 0 10px}
.person h3{font-size:21px;margin-bottom:6px}
.person .aff{font-size:13px;color:var(--muted);margin-bottom:14px;line-height:1.5}
.person .bio{font-size:14px;color:var(--item);flex:1}
.person .focus{font-size:13.5px;color:var(--ink2);margin-bottom:14px}
.person .focus .k{color:var(--muted);margin-right:8px}
.person .mail{align-self:flex-start;font-size:13px;overflow-wrap:anywhere}

/* timeline */
.tl{border-top:1px solid var(--ink)}
.tl-row{display:grid;grid-template-columns:130px 1fr 260px;gap:28px;padding:20px 0;border-bottom:1px solid var(--rule)}
.tl-w .num{display:block;font-size:24px;line-height:1}
.tl-w .dates{display:block;margin-top:8px;font-size:12.5px;color:var(--muted)}
.tl-b h3{font-size:18px}
.tl-b p{margin:0;font-size:14px;color:var(--item)}
.tl-d{display:flex;flex-direction:column;gap:6px;font-size:13px;color:var(--ink2);padding-top:3px}
.tl-row.past .tl-b,.tl-row.past .tl-d{color:var(--muted)}
.cur{color:var(--accent);margin-left:10px;font-size:9.5px;vertical-align:3px}

/* deliverables */
.progress{display:flex;align-items:center;gap:20px;margin:0 0 26px;font-size:13px;color:var(--muted)}
.progress span{flex:none}
.bar{flex:1;max-width:340px;height:1px;background:var(--rule2)}
.bar i{display:block;height:3px;margin-top:-1px;background:var(--accent)}
.dv{border-top:1px solid var(--ink)}
.dv-row{display:grid;grid-template-columns:52px 1fr 130px 120px 300px;gap:20px;align-items:center;padding:18px 0;border-bottom:1px solid var(--rule)}
.dv-hd{padding:10px 0;font:600 10px/1 var(--sans);letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.dv-row .num{font-size:18px}
.dv-t .t{display:block;font:17px/1.3 var(--serif);color:var(--ink)}
.dv-t .d{display:block;font-size:13.5px;color:var(--item);margin-top:3px}
.dv-tg{font-size:13.5px;color:var(--ink2)}
.dv-tg .m{display:none}
.st{color:var(--muted);font-size:10px}
.st-In,.st-Submitted{color:var(--ink)}
.st-Approved{color:var(--accent)}
.dv-a{display:flex;gap:8px;justify-content:flex-end}
.dv-a .btn{min-height:36px;padding:0 14px;font-size:12px}
.tracker{align-items:center}
.pending-note{font:italic 14px var(--serif);color:var(--muted)}

/* how we work / services */
.grid3{display:grid;grid-template-columns:repeat(3,1fr);column-gap:40px;margin:0;border-top:1px solid var(--ink)}
.grid3>div{padding:20px 0 22px;border-bottom:1px solid var(--rule)}
.grid3 dt{display:flex;align-items:baseline;gap:12px;font:19px/1.3 var(--serif);letter-spacing:0;text-transform:none;color:var(--ink);margin-bottom:8px}
.grid3 dt .num{font-size:14px}
.grid3 dd{margin:0;font-size:14px;color:var(--item)}
.intro.wide{font:17px/1.65 var(--serif);max-width:800px}
.res>div{padding-top:22px}
.res h3{font-size:19px;margin-bottom:12px}
.res ul{margin:0;padding:0;list-style:none}
.res li{position:relative;padding:8px 0 8px 16px;border-top:1px solid var(--rule);font-size:13.5px;color:var(--item)}
.res li::before{content:"";position:absolute;left:0;top:17px;width:6px;height:1px;background:var(--accent)}
.links{display:flex;flex-wrap:wrap;align-items:baseline;gap:10px 30px;margin-top:36px;padding:16px 0;border-top:1px solid var(--ink);border-bottom:1px solid var(--rule);font-size:14px}
.links .k{color:var(--muted);width:120px}
.links .arr{margin-left:8px;color:var(--accent)}

/* knowledge check */
.quiz{margin-top:48px;padding:28px 32px 30px;background:var(--white);border:1px solid var(--rule2)}
.qh{display:flex;justify-content:space-between;align-items:baseline;padding-bottom:12px;margin-bottom:22px;border-bottom:1px solid var(--rule);font-size:12.5px;color:var(--muted)}
.qh .k{color:var(--accent)}
.qq{font:21px/1.4 var(--serif);color:var(--ink);max-width:760px;margin-bottom:22px}
.opts{display:grid;gap:8px;max-width:620px}
.opt{display:flex;align-items:center;gap:16px;min-height:48px;padding:10px 16px;text-align:left;font:14.5px/1.4 var(--sans);color:var(--ink2);
  background:transparent;border:1px solid var(--rule2);border-radius:0;cursor:pointer;transition:border-color .15s}
.opt:hover:not(:disabled){border-color:var(--ink)}
.opt:disabled{cursor:default}
.opt .ol{flex:none;font:14px var(--serif);color:var(--muted);width:14px}
.opt.ok{border-color:var(--accent);color:var(--ink)}
.opt.ok .ol{color:var(--accent)}
.opt.no{border-color:#9C5A52;color:var(--muted)}
.why{margin-top:18px;max-width:720px;font-size:14px;color:var(--item)}
.why .btn{margin-top:4px}
.qres{font:30px/1.2 var(--serif);color:var(--ink);margin-bottom:8px}
.qmsg{color:var(--item)}

/* faq */
.faq{border-top:1px solid var(--ink);max-width:860px}
.faq details{border-bottom:1px solid var(--rule)}
.faq summary{list-style:none;cursor:pointer;display:flex;justify-content:space-between;gap:20px;padding:17px 0;font:17px/1.4 var(--serif);color:var(--ink)}
.faq summary::-webkit-details-marker{display:none}
.faq summary::after{content:"+";font:300 20px/1 var(--sans);color:var(--muted)}
.faq details[open] summary::after{content:"\2013"}
.faq details p{margin:0 0 18px;max-width:720px;font-size:14.5px;color:var(--item)}

/* contact */
.contact{display:grid;grid-template-columns:1.2fr 1fr auto;border-top:1px solid var(--ink);border-bottom:1px solid var(--rule)}
.contact>div{padding:22px 28px 22px 0}
.contact>div+div{padding-left:28px;border-left:1px solid var(--rule)}
.contact p.k{color:var(--muted);margin:0 0 6px;font-size:10.5px}
.contact p{font-size:14px;color:var(--item)}
.contact p+.k{margin-top:14px}
.contact .nm{font:24px/1.25 var(--serif);color:var(--ink);margin-bottom:6px}
.contact .ca{display:flex;flex-direction:column;gap:8px;justify-content:center}
#contact .sh{border-bottom:0;margin-bottom:4px}

/* footer */
.foot{margin-top:110px;padding:0 var(--pad)}
.foot-in{max-width:calc(var(--max) - 2 * var(--pad));margin:0 auto;padding:18px 0 40px;display:flex;justify-content:space-between;gap:20px;flex-wrap:wrap;border-top:1px solid var(--ink);font-size:12px;color:var(--muted)}
.foot .sc{font:13px var(--serif);font-variant:small-caps;letter-spacing:.04em;color:var(--ink2)}

/* ---------- responsive ---------- */
@media (max-width:980px){
  .dv-row{grid-template-columns:44px 1fr 120px 110px}
  .dv-hd span:last-child{display:none}
  .dv-a{grid-column:2 / -1;justify-content:flex-start}
  .tl-row{grid-template-columns:110px 1fr}
  .tl-d{grid-column:2}
  .team,.grid3{grid-template-columns:1fr 1fr}
  .person:not(:nth-child(3n+1)){padding-left:0;border-left:0}
  .person:nth-child(2n){padding-left:28px;border-left:1px solid var(--rule)}
}
@media (max-width:720px){
  html{scroll-padding-top:112px}
  .gate-body{padding:32px 0 0}
  .gate-body h1{font-size:40px}
  .mast-in{padding-top:14px;padding-bottom:12px}
  .nav a{padding:13px 0 12px}
  .logo{height:28px}
  .mast-lbl,.mast-who{display:none}
  .nav-in{gap:22px}
  .hero{padding-top:48px}
  .hero .lede{font-size:17px}
  .next{margin-bottom:40px}
  .next .k{display:block;margin:0 0 4px}
  .meta{grid-template-columns:1fr 1fr}
  .meta>div{padding:14px 12px 14px 0!important;border-left:0!important;border-bottom:1px solid var(--rule)}
  .meta>div:nth-child(2n){padding-left:14px!important;border-left:1px solid var(--rule)!important}
  .meta>div:nth-last-child(-n+2){border-bottom:0}
  .sec{padding-top:64px}
  .cols2,.team,.grid3,.contact{grid-template-columns:1fr;gap:0}
  .cols2>div+div{margin-top:10px}
  .person,.person:nth-child(2n),.person:not(:nth-child(3n+1)){padding:22px 0;border-left:0}
  .tl-row{grid-template-columns:1fr;gap:8px}
  .tl-w{display:flex;align-items:baseline;gap:12px}
  .tl-w .dates{margin:0}
  .tl-d{grid-column:1}
  .dv-hd{display:none}
  .dv-row{grid-template-columns:36px 1fr;gap:6px 14px;align-items:start;padding:20px 0}
  .dv-tg,.st,.dv-a{grid-column:2}
  .dv-tg .m{display:inline;color:var(--muted);margin-right:8px;font-size:10px}
  .dv-a{margin-top:10px;flex-wrap:wrap}
  .dv-a .btn{flex:1;min-height:44px}
  .kv,.kv:not(.tracker){grid-template-columns:1fr;gap:8px}
  .kv .sep{margin:0 6px}
  .links{flex-direction:column;gap:12px}
  .quiz{padding:22px 18px 24px}
  .qq{font-size:19px}
  .qh{flex-direction:column;gap:4px}
  .contact>div,.contact>div+div{padding:18px 0;border-left:0;border-bottom:1px solid var(--rule)}
  .contact>div:last-child{border-bottom:0}
  .contact .btn{min-height:46px}
  .foot{margin-top:80px}
  .foot-in{flex-direction:column;gap:8px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;scroll-behavior:auto!important}}
@media print{.mast{position:static}.nav,.dv-a,#out{display:none}}
</style>
</head>
<body>
<main id="gate" class="gate">
  <div class="gate-in">

    const a = await getMsal();
    const res = await a.handleRedirectPromise();
    if (location.hash) history.replaceState(null, "", location.pathname);
    if (!res || !res.idToken) { msBusy(false); return; }
    await ssoFinish(res);
  } catch (e) {
    const s = typeof e === "string" ? e : (/AADSTS50105|AADSTS50020|AADSTS700016|access_denied/i.test(String(e && (e.errorMessage || e.message || e.errorCode))) ? MSG_DENY : MSG_FAIL);
    msFail(s);
    try { history.replaceState(null, "", location.pathname); } catch {}
  }
})();

const TICK = '<svg class="tk" viewBox="0 0 12 12" aria-hidden="true"><polyline points="2.1,6.7 4.9,9.3 10.3,2.7" fill="none" stroke="currentColor" stroke-width="1.1" stroke-linecap="round" stroke-linejoin="round"/></svg>';

  const A = D.admin;

  const mailto = (d) => `mailto:${D.submissions.mailto}?subject=${encodeURIComponent(mailSubj(d))}&body=${encodeURIComponent("Hi " + A.first + ",\n\nI have uploaded my work for Deliverable " + d.n + " (" + d.title + ") to the OneDrive folder.\n\nFile name: \nNotes: \n\nThank you,\n" + me.first)}`;
  const hr = new Date().toLocaleString("en-CA", { timeZone: "America/Toronto", hour: "numeric", hour12: false });
  const salute = +hr < 12 ? "Good morning" : +hr < 18 ? "Good afternoon" : "Good evening";
  const sec = (id, n, label, title, body, extra = "") => `
<section id="${id}" class="sec ${extra}">

  ${title ? `<h2>${title}</h2>` : ""}

</section>`;
  const tracker = D.hour_tracker.url
    ? `<a class="btn" href="${esc(D.hour_tracker.url)}" target="_blank" rel="noopener">Open hour tracker</a>`
    : `<span class="pending-note">Link to follow</span>`;

  app.innerHTML = `
<header class="mast"><div class="mast-in">

    <span class="mast-lbl">Intern Programme</span>

</div></nav></header>

<main class="wrap">
<section id="welcome" class="hero">

  <h1>${salute}, ${esc(me.first)}.</h1>
  <p class="lede">Welcome to the IT Rapid Support Intern Programme. Over seven weeks the team will build the firm's first client evidence library: interviews with clients, turned into case studies, testimonials and a sales sheet for publication on itrapidsupport.com.</p>
  <p class="next" id="nextLbl"></p>
  <dl class="meta">
    <div><dt>Programme</dt><dd>${esc(D.program.title)}</dd></div>
    <div><dt>Duration</dt><dd>7 weeks, 5 October to 20 November</dd></div>
    <div><dt>Commitment</dt><dd>60 hours per intern</dd></div>
    <div><dt>Deliverables approved</dt><dd><span class="acc">${done}</span> of 6</dd></div>
  </dl>
</section>

${sec("brief", 1, "Project brief", esc(D.program.title), `
  <div class="cols2">
    <div>
      <h3>Objective</h3><p>${esc(D.program.goal)}</p>
      <h3>Why it matters</h3><p>${esc(D.program.why)}</p>
    </div>
    <div>
      <h3>Scope of work</h3>
      <ol class="scope">
        <li>Design a repeatable client-interview guide and consent and approval workflow</li>
        <li>Conduct approximately 30-minute remote interviews with 4-6 consenting ITRS clients across key sectors</li>
        <li>Write polished case studies: challenge, solution, outcome</li>
        <li>Curate a testimonial quote bank tagged by service and sector</li>
        <li>Produce a one-page sales sheet</li>
        <li>Manage client approvals and revision rounds</li>
        <li>Pair on interviews and edit one another's drafts into one voice</li>
        <li>Present the finished library to the ITRS team</li>
      </ol>
    </div>
  </div>
  <div class="kv"><span class="k">Sectors</span><span class="v">${D.verticals.map(esc).join('<span class="sep">&middot;</span>')}</span></div>`)}

${sec("team", 2, "The team", "Programme team", `
  <div class="team crew">
  ${D.students.map(s => `
    <article class="person ${s.id === who.id ? "me" : ""}" id="crew-${s.id}">
      <p class="role">${s.id === who.id ? '<span class="acc">You</span> &middot; ' : ""}Intern</p>
      <h3>${esc(s.name)}</h3>
      <p class="aff">${esc(s.program)}<br>${esc(s.school)}</p>
      <p class="bio">${esc(s.bio)}</p>
      <p class="focus"><span class="k">Strength</span> ${esc(s.superpower)}</p>
      <a class="mail" href="mailto:${esc(s.email)}">${esc(s.email)}</a>
    </article>`).join("")}
    <article class="person lead ${who.admin ? "me" : ""}" id="crew-admin">
      <p class="role">${who.admin ? '<span class="acc">You</span> &middot; ' : ""}Programme lead</p>
      <h3>${esc(A.name)}, MBA, LL.M</h3>
      <p class="aff">${esc(A.title)}<br>${esc(A.org)}</p>
      <p class="bio">Arranges client introductions, briefs the team on each engagement, edits drafts and chairs the weekly check-in.</p>
      <p class="focus"><span class="k">Focus</span> Turning incidents into lessons</p>
      <a class="mail" href="mailto:${esc(A.email)}">${esc(A.email)}</a>
    </article>
  </div>
  ${who.admin ? "" : `<p class="note">Your ITRS email address is <span class="ink">${esc(me.email)}</span>. Please use it for all programme correspondence.</p>`}`)}

${sec("timeline", 3, "Programme timeline", "Seven weeks, six deliverables", `
  <div class="tl">
  ${D.weeks.map(w => `
    <div class="tl-row ${w.w === wkNow ? "now" : w.w < wkNow ? "past" : ""}">
      <div class="tl-w"><span class="num">${two(w.w)}</span><span class="dates">${esc(w.dates)}</span></div>
      <div class="tl-b"><h3>${esc(w.title)}${w.w === wkNow ? ' <span class="cur">Current week</span>' : ""}</h3><p>${esc(w.quest)}</p></div>
      <div class="tl-d">${w.levels.map(n => `<span>D${n} &middot; ${esc(D.deliverables[n - 1].title)}</span>`).join("") || '<span class="faint">No deliverable due</span>'}</div>
    </div>`).join("")}

  <p class="note">Weekly targets are indicative; exact dates will be confirmed together at kick-off.</p>`)}

${sec("deliverables", 4, "Deliverables", "Status and submission", `
  <p class="intro">${esc(D.submissions.howto)}</p>
  <div class="progress"><span>${done} of 6 approved</span><div class="bar"><i style="width:${Math.round(done / 6 * 100)}%"></i></div></div>
  <div class="dv">
    <div class="dv-row dv-hd"><span>No.</span><span>Deliverable</span><span>Target</span><span>Status</span><span></span></div>
  ${D.deliverables.map(d => `
    <div class="dv-row" id="${d.id}">
      <span class="num">${two(d.n)}</span>
      <span class="dv-t"><span class="t">${esc(d.title)}</span><span class="d">${esc(d.detail)}</span></span>
      <span class="dv-tg"><span class="m">Target</span>${esc(d.target)}</span>
      <span class="st st-${stClass(d.status)}">${d.status === "Approved" ? TICK : ""}${esc(d.status)}</span>
      <span class="dv-a">
        ${d.folder ? `<a class="btn" href="${esc(d.folder)}" target="_blank" rel="noopener">Upload to folder</a>` : ""}
        <a class="btn ghost" href="${mailto(d)}">Notify ${esc(A.first)}</a>
      </span>
    </div>`).join("")}
  </div>
  <div class="kv tracker"><span class="k">Hours</span><span class="v"><span class="ink">${esc(D.hour_tracker.label)}</span><br>${esc(D.hour_tracker.note)}</span><span class="a">${tracker}</span></div>
  ${who.admin ? `<div class="kv"><span class="k">Administrator</span><span class="v">Edit <code>deliverables[].status</code> in portal/data/data.json (Not started / In progress / Submitted / Approved), then rebuild and deploy (see README). Deliverables root folder: <a href="${esc(D.submissions.root)}" target="_blank" rel="noopener">OneDrive</a>.</span></div>` : ""}`)}

${sec("work", 5, "How we work", "Working arrangements", `
  <dl class="grid3">${D.how_we_work.map((h, i) => `<div><dt><span class="num">${two(i + 1)}</span>${esc(h.title)}</dt><dd>${esc(h.text)}</dd></div>`).join("")}</dl>`)}

${sec("primer", 6, "Cybersecurity primer", "What IT Rapid Support does", `
  <p class="intro wide">Cybersecurity is the protection of an organisation's people, data and systems from threats such as phishing, account takeover, ransomware and fraud. IT Rapid Support is an Ontario IT services and cybersecurity firm that keeps small and mid-sized businesses running securely, so they can focus on their work.</p>
  <dl class="grid3">${D.services.map((s, i) => `<div><dt><span class="num">${two(i + 1)}</span>${esc(s.title)}</dt><dd>${esc(s.text)}</dd></div>`).join("")}</dl>
  <div class="quiz" id="quiz"></div>`)}

${sec("resources", 7, "Resources", "Reference material", `
  <div class="grid3 res">${D.resources.map(r => `<div><h3>${esc(r.title)}</h3><ul>${r.items.map(i => `<li>${esc(i)}</li>`).join("")}</ul></div>`).join("")}</div>
  <div class="links"><span class="k">Links</span>${D.vfc_links.map(l => `<a href="${esc(l.url)}" target="_blank" rel="noopener">${esc(l.label)}<span class="arr" aria-hidden="true">&rarr;</span></a>`).join("")}</div>`)}

${sec("faq", 8, "Questions", "Frequently asked questions", `

${sec("contact", 9, "Contact", "", `
  <div class="contact">
    <div><p class="k">Programme lead</p><p class="nm">${esc(A.name)}, MBA, LL.M</p><p>${esc(A.title)}<br>${esc(A.org)}</p></div>
    <div><p class="k">Email</p><p><a href="mailto:${esc(A.email)}">${esc(A.email)}</a></p><p class="k">Mobile</p><p><a href="tel:${esc(A.mobile_tel)}">${esc(A.mobile)}</a></p></div>

</main>
<footer class="foot"><div class="foot-in">
  <span class="sc">Private &amp; Confidential. Prepared for the ${esc(D.program.cohort)}.</span>

</div></footer>`;

  $("#out").onclick = () => localSignOut(!!who.sso);

  // nav highlight (visual only; content never depends on it)
  const links = [...document.querySelectorAll("#nav a")];
  if ("IntersectionObserver" in window) {
    const so = new IntersectionObserver(es => es.forEach(e => { if (e.isIntersecting) links.forEach(a => a.classList.toggle("on", a.getAttribute("href") === "#" + e.target.id)); }), { rootMargin: "-35% 0px -60% 0px" });
    document.querySelectorAll("section[id]").forEach(s => so.observe(s));
  }

  // next event line
  const evs = D.events.map(e => ({ ...e, t: new Date(e.when).getTime(), end: new Date(e.end || e.when).getTime() })).sort((a, b) => a.t - b.t);
  const fmt = (t) => {
    const p = Object.fromEntries(new Intl.DateTimeFormat("en-CA", { timeZone: "America/Toronto", weekday: "long", day: "numeric", month: "long", hour: "2-digit", minute: "2-digit", hourCycle: "h23" }).formatToParts(new Date(t)).map(x => [x.type, x.value]));
    return `${p.weekday} ${p.day} ${p.month}, ${p.hour}:${p.minute} ET`;
  };
  const tick = () => {
    const now = Date.now(), lbl = $("#nextLbl"); if (!lbl) return;
    const live = evs.find(e => e.end > e.t && now >= e.t && now < e.end);
    const nx = evs.find(e => e.t > now);
    if (live) { lbl.innerHTML = `<span class="k">In progress</span> ${esc(live.title)} &middot; ${esc(live.where)}`; return; }
    if (!nx) { lbl.innerHTML = `<span class="k">Programme complete</span> Thank you to every member of the team.`; return; }
    const days = Math.floor((nx.t - now) / 864e5);
    const rel = days >= 2 ? ` &middot; in ${days} days` : "";
    lbl.innerHTML = `<span class="k">Next meeting</span> ${esc(nx.title)} &middot; ${esc(fmt(nx.t))} &middot; ${esc(nx.where)}${rel}`;
  };
  tick(); setInterval(tick, 30000);

  // knowledge check
  const Q = D.quiz; let qi = 0, score = 0;
  const qz = $("#quiz");
  const renderQ = () => {
    if (qi >= Q.length) {
      const msg = score === Q.length ? "All answers correct." : score >= 3 ? "A sound result. Review the explanations for any you missed." : "Worth revisiting. Phishing and fraud are good topics for your conversation with " + esc(A.first) + ".";
      qz.innerHTML = `<header class="qh"><span class="k">Knowledge check</span><span>Complete</span></header>
        <p class="qres"><span class="acc">${score}</span> of ${Q.length} correct</p><p class="qmsg">${msg}</p>
        <button class="btn ghost" id="again" type="button">Start again</button>`;
      $("#again").onclick = () => { qi = 0; score = 0; renderQ(); };
      return;
    }
    const q = Q[qi];
    qz.innerHTML = `<header class="qh"><span class="k">Knowledge check</span><span>Question ${qi + 1} of ${Q.length}</span></header>
      <p class="qq">${esc(q.q)}</p>
      <div class="opts">${q.a.map((a, i) => `<button class="opt" type="button" data-i="${i}"><span class="ol">${"ABC"[i] || i + 1}</span><span>${esc(a)}</span></button>`).join("")}</div>
      <div class="why" aria-live="polite"></div>`;
    qz.querySelectorAll(".opt").forEach(b => b.onclick = () => {
      const i = +b.dataset.i; qz.querySelectorAll(".opt").forEach(x => x.disabled = true);
      qz.querySelectorAll(".opt")[q.c].classList.add("ok");
      if (i === q.c) score++; else b.classList.add("no");
      qz.querySelector(".why").innerHTML = `<p><span class="ink">${i === q.c ? "Correct." : "Not quite."}</span> ${esc(q.why)}</p><button class="btn" id="nextq" type="button">${qi + 1 < Q.length ? "Next question" : "See result"}</button>`;
      $("#nextq").onclick = () => { qi++; renderQ(); };
    });
  };
  renderQ();
}
})();
</script>
