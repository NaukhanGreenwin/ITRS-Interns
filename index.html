<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="referrer" content="no-referrer">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src data:; connect-src 'none'; base-uri 'none'; form-action 'none'">
<meta name="theme-color" content="#0b1424">
<title>ITRS Crew Portal</title>
<style>:root{
  --bg:#0b1424;--bg2:#101c31;--card:#15233b;--card2:#1b2c49;--line:rgba(255,255,255,.09);
  --ink:#eef2f8;--muted:#9fb0c8;--red:#A3231B;--red2:#d23a2e;--gold:#f2b544;--teal:#39c3b0;--blue:#4f8cff;
  --r:18px;--shadow:0 10px 30px rgba(0,0,0,.35);
  font-family:ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI",Inter,Roboto,Helvetica,Arial,sans-serif;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth;-webkit-text-size-adjust:100%}
body{margin:0;background:radial-gradient(1200px 600px at 80% -10%,rgba(163,35,27,.25),transparent 60%),radial-gradient(900px 500px at -10% 10%,rgba(79,140,255,.18),transparent 60%),var(--bg);color:var(--ink);line-height:1.55;min-height:100vh;overflow-x:hidden}
a{color:#ffb3ad}
.stars{position:fixed;inset:0;pointer-events:none;z-index:0;background-image:radial-gradient(1px 1px at 20% 30%,#fff8,transparent 50%),radial-gradient(1px 1px at 70% 60%,#fff6,transparent 50%),radial-gradient(1.5px 1.5px at 40% 80%,#fff5,transparent 50%),radial-gradient(1px 1px at 90% 20%,#fff7,transparent 50%),radial-gradient(1px 1px at 10% 90%,#fff5,transparent 50%);background-size:340px 340px;animation:drift 90s linear infinite;opacity:.6}
@keyframes drift{to{background-position:340px 680px}}
/* gate */
.gate{position:relative;z-index:1;min-height:100vh;display:grid;place-items:center;padding:24px}
.gate-card{width:min(420px,100%);background:linear-gradient(180deg,rgba(27,44,73,.92),rgba(21,35,59,.92));border:1px solid var(--line);border-radius:24px;padding:32px 26px;box-shadow:var(--shadow);backdrop-filter:blur(8px);animation:rise .6s cubic-bezier(.2,.8,.2,1)}
.gate-logo{width:190px;max-width:70%;display:block;margin:0 auto 18px}
.gate h1{margin:.1em 0 .2em;font-size:1.9rem;text-align:center}
.gate .muted,.gate .eyebrow{text-align:center}
form{display:grid;gap:14px;margin-top:18px}
label{display:grid;gap:6px;font-size:.85rem;color:var(--muted)}
input{font:inherit;color:var(--ink);background:#0d1829;border:1px solid var(--line);border-radius:12px;padding:13px 14px;font-size:16px;outline:none;transition:border-color .2s,box-shadow .2s}
input:focus{border-color:var(--red2);box-shadow:0 0 0 4px rgba(210,58,46,.2)}
button,.btn{font:inherit;font-weight:650;cursor:pointer;border:0;border-radius:12px;padding:13px 18px;background:linear-gradient(135deg,var(--red),var(--red2));color:#fff;text-decoration:none;display:inline-flex;align-items:center;justify-content:center;gap:8px;transition:transform .15s,box-shadow .2s,filter .2s;box-shadow:0 6px 18px rgba(163,35,27,.35)}
button:hover,.btn:hover{transform:translateY(-1px);filter:brightness(1.08)}
button:active,.btn:active{transform:translateY(1px)}
button[disabled]{opacity:.7;cursor:wait}
.btn.ghost{background:transparent;border:1px solid var(--line);box-shadow:none;color:var(--ink)}
.btn.small{padding:8px 12px;font-size:.85rem;border-radius:10px}
.err{min-height:1.2em;color:#ff8f86;margin:0;text-align:center;font-size:.9rem}
.shake{animation:shake .4s}
@keyframes shake{20%,60%{transform:translateX(-8px)}40%,80%{transform:translateX(8px)}}
@keyframes rise{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
.spin{width:16px;height:16px;border:2px solid #fff6;border-top-color:#fff;border-radius:50%;animation:sp 0.8s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
/* app */
#app{position:relative;z-index:1}
.top{position:sticky;top:0;z-index:20;background:rgba(11,20,36,.82);backdrop-filter:blur(12px);border-bottom:1px solid var(--line)}
.top-in{max-width:1120px;margin:0 auto;display:flex;align-items:center;gap:12px;padding:10px 16px}
.top img{height:30px}
.top .who{margin-left:auto;display:flex;align-items:center;gap:10px;font-size:.9rem;color:var(--muted)}
.nav{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;max-width:1120px;margin:0 auto;padding:0 16px 10px}
.nav::-webkit-scrollbar{display:none}
.nav a{flex:none;color:var(--muted);text-decoration:none;font-size:.85rem;padding:6px 12px;border-radius:999px;border:1px solid var(--line);transition:.2s}
.nav a:hover,.nav a.on{color:#fff;background:var(--red);border-color:var(--red)}
.wrap{max-width:1120px;margin:0 auto;padding:0 16px}
section{padding:46px 0 10px;scroll-margin-top:100px}
.reveal{opacity:0;transform:translateY(22px);transition:opacity .7s,transform .7s cubic-bezier(.2,.8,.2,1)}
.reveal.in{opacity:1;transform:none}
.eyebrow{text-transform:uppercase;letter-spacing:.16em;font-size:.72rem;color:var(--gold);font-weight:700;margin:0}
h2{font-size:clamp(1.5rem,4.5vw,2.2rem);margin:.2em 0 .4em;line-height:1.15}
h3{margin:.2em 0 .3em;font-size:1.1rem}
.muted{color:var(--muted)}
.grid{display:grid;gap:14px}
@media(min-width:680px){.g2{grid-template-columns:repeat(2,1fr)}.g3{grid-template-columns:repeat(3,1fr)}}
@media(min-width:980px){.g3l{grid-template-columns:repeat(3,1fr)}}
.card{background:linear-gradient(180deg,var(--card2),var(--card));border:1px solid var(--line);border-radius:var(--r);padding:20px;box-shadow:var(--shadow);transition:transform .25s,border-color .25s}
.card:hover{transform:translateY(-3px);border-color:rgba(255,255,255,.18)}
/* hero */
.hero{padding-top:34px}
.hero-card{position:relative;overflow:hidden;border-radius:26px;padding:28px 22px;background:linear-gradient(135deg,#17294a 0%,#0f1d35 55%,#3a1414 130%);border:1px solid var(--line);box-shadow:var(--shadow)}
.hero-card:after{content:"";position:absolute;right:-80px;top:-80px;width:260px;height:260px;border-radius:50%;background:radial-gradient(circle,rgba(163,35,27,.55),transparent 70%);animation:pulse 5s ease-in-out infinite}
@keyframes pulse{50%{transform:scale(1.15);opacity:.7}}
.hero h1{font-size:clamp(1.8rem,6vw,3rem);line-height:1.08;margin:.25em 0 .35em;position:relative;z-index:1}
.hero h1 .wave{display:inline-block;animation:wave 2.2s ease-in-out 1s 2;transform-origin:70% 70%}
@keyframes wave{10%,30%{transform:rotate(14deg)}20%{transform:rotate(-8deg)}40%,100%{transform:none}}
.hero p{position:relative;z-index:1;max-width:680px}
.stamp{display:inline-flex;gap:8px;align-items:center;font-size:.72rem;font-weight:800;letter-spacing:.14em;text-transform:uppercase;color:#ffd2ce;border:1.5px dashed #ffb3ad88;padding:5px 10px;border-radius:8px;transform:rotate(-2deg);position:relative;z-index:1}
.count{display:flex;gap:10px;margin-top:18px;position:relative;z-index:1;flex-wrap:wrap}
.count .u{min-width:68px;text-align:center;background:rgba(0,0,0,.28);border:1px solid var(--line);border-radius:14px;padding:10px 8px}
.count .n{font-size:1.7rem;font-weight:800;font-variant-numeric:tabular-nums;display:block;line-height:1}
.count .l{font-size:.68rem;color:var(--muted);text-transform:uppercase;letter-spacing:.1em}
.next-lbl{margin-top:18px;font-weight:650;position:relative;z-index:1}
.stats{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-top:16px}
@media(min-width:680px){.stats{grid-template-columns:repeat(4,1fr)}}
.stat{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;text-align:center}
.stat b{display:block;font-size:1.6rem;color:#fff}
.stat span{font-size:.78rem;color:var(--muted)}
/* crew */
.crew .card{position:relative;overflow:hidden}
.crew .me{border-color:var(--red2);box-shadow:0 0 0 2px rgba(210,58,46,.5),var(--shadow)}
.crew .me:before{content:"That's you";position:absolute;top:14px;right:-34px;transform:rotate(35deg);background:var(--red);color:#fff;font-size:.68rem;font-weight:800;padding:4px 40px;letter-spacing:.06em}
.av{width:56px;height:56px;border-radius:16px;display:grid;place-items:center;font-size:1.7rem;background:linear-gradient(135deg,#243a60,#18263f);border:1px solid var(--line);margin-bottom:10px;transition:transform .3s}
.card:hover .av{transform:rotate(-8deg) scale(1.08)}
.chip{display:inline-block;font-size:.72rem;padding:3px 9px;border-radius:999px;background:rgba(255,255,255,.07);border:1px solid var(--line);color:var(--muted);margin:2px 4px 2px 0}
.chip.red{background:rgba(163,35,27,.25);border-color:rgba(210,58,46,.5);color:#ffd2ce}
.chip.gold{background:rgba(242,181,68,.15);border-color:rgba(242,181,68,.4);color:#ffe2a8}
.mail{font-size:.85rem;word-break:break-all}
.fun{font-size:.88rem;color:#dbe4f2;margin-top:8px;padding-top:8px;border-top:1px dashed var(--line)}
.pending{opacity:.85;border-style:dashed}
/* quest map */
.quest{position:relative;display:grid;gap:14px;padding-left:28px}
.quest:before{content:"";position:absolute;left:10px;top:6px;bottom:6px;width:3px;border-radius:3px;background:linear-gradient(var(--red2),var(--gold),var(--teal))}
.wk{position:relative}
.wk:before{content:attr(data-w);position:absolute;left:-30px;top:16px;width:24px;height:24px;border-radius:50%;background:var(--bg);border:3px solid var(--red2);display:grid;place-items:center;font-size:.7rem;font-weight:800}
.wk.now:before{background:var(--red2);box-shadow:0 0 0 6px rgba(210,58,46,.25);animation:pulse 2s infinite}
.wk.done:before{background:var(--teal);border-color:var(--teal);content:"✓"}
.wk .card{padding:16px}
.levels{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.lvl{font-size:.78rem;padding:5px 10px;border-radius:10px;background:rgba(242,181,68,.12);border:1px solid rgba(242,181,68,.35);color:#ffe2a8}
/* badges / deliverables */
.badge{display:flex;gap:14px;align-items:flex-start}
.medal{flex:none;width:58px;height:58px;border-radius:50%;display:grid;place-items:center;font-size:1.6rem;background:radial-gradient(circle at 30% 30%,#2b4471,#15233b);border:2px solid #ffffff22;position:relative;transition:transform .4s}
.medal.st-Approved{background:radial-gradient(circle at 30% 30%,#ffe08a,#c98a17);border-color:#ffe2a8;box-shadow:0 0 22px rgba(242,181,68,.45)}
.medal.st-Submitted{border-color:var(--teal)}
.medal.st-In{border-color:var(--blue)}
.card:hover .medal{transform:rotateY(180deg)}
.status{font-size:.72rem;font-weight:750;padding:4px 10px;border-radius:999px;display:inline-block;letter-spacing:.03em}
.s-Not{background:rgba(255,255,255,.08);color:var(--muted)}
.s-In{background:rgba(79,140,255,.18);color:#b9d0ff}
.s-Submitted{background:rgba(57,195,176,.18);color:#a6f0e4}
.s-Approved{background:rgba(242,181,68,.2);color:#ffe2a8}
.bar{height:10px;border-radius:10px;background:rgba(255,255,255,.08);overflow:hidden;margin:8px 0 4px}
.bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--red2),var(--gold));border-radius:10px;transition:width 1.4s cubic-bezier(.2,.8,.2,1)}
.row{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
/* brief */
.brief-list{margin:0;padding-left:1.1em}
.brief-list li{margin:.35em 0}
/* quiz */
.quiz .q{font-weight:650;margin-bottom:12px}
.opts{display:grid;gap:8px}
.opt{text-align:left;background:#0d1829;border:1px solid var(--line);box-shadow:none;font-weight:500}
.opt.ok{background:rgba(57,195,176,.2);border-color:var(--teal)}
.opt.no{background:rgba(210,58,46,.2);border-color:var(--red2)}
.why{margin-top:10px;font-size:.9rem;color:#dbe4f2;min-height:1.4em}
.qhead{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;font-size:.8rem;color:var(--muted)}
.dots{display:flex;gap:5px}.dots i{width:8px;height:8px;border-radius:50%;background:#ffffff22}.dots i.on{background:var(--gold)}
.confetti{position:fixed;top:-10px;width:9px;height:14px;z-index:99;pointer-events:none;animation:fall linear forwards}
@keyframes fall{to{transform:translateY(105vh) rotate(720deg)}}
/* resources, faq */
.res ul{margin:.3em 0 0;padding-left:1.1em}.res li{margin:.3em 0;font-size:.93rem}
details{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:0 16px;transition:background .2s}
details[open]{background:var(--card2)}
summary{cursor:pointer;list-style:none;padding:14px 0;font-weight:650;display:flex;justify-content:space-between;gap:10px}
summary::-webkit-details-marker{display:none}
summary:after{content:"+";color:var(--gold);font-size:1.2rem;transition:transform .25s}
details[open] summary:after{transform:rotate(45deg)}
details p{margin:0 0 14px;color:#dbe4f2}
.contact{display:flex;flex-wrap:wrap;gap:16px;align-items:center;justify-content:space-between;background:linear-gradient(135deg,#3a1414,#17294a);}
.placeholder{border:1.5px dashed var(--gold);background:rgba(242,181,68,.07)}
footer{padding:40px 16px 60px;text-align:center;color:var(--muted);font-size:.8rem}
.toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%) translateY(120px);background:#0d1829;border:1px solid var(--line);padding:12px 16px;border-radius:12px;z-index:50;transition:transform .35s;box-shadow:var(--shadow);font-size:.9rem}
.toast.show{transform:translateX(-50%)}
.hl{animation:hl 2.4s 1}
@keyframes hl{0%,40%{box-shadow:0 0 0 6px rgba(242,181,68,.55),var(--shadow)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}.reveal{opacity:1;transform:none}}
</style>
</head>

<script>"use strict";
(() => {
const $ = (s, r = document) => r.querySelector(s);
const te = new TextEncoder(), td = new TextDecoder();
const META = JSON.parse($("#meta").textContent);
const b2u = (b) => Uint8Array.from(atob(b), c => c.charCodeAt(0));
const u2b = (u) => btoa(String.fromCharCode(...u));
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const SKEY = "itrs-crew-session";

function loginId(raw) {
  let s = String(raw || "").trim().toLowerCase();
  if (s.includes("@")) s = s.split("@")[0];
  s = s.split(/[.\s_]+/)[0];
  return s;
}
async function slotHash(id) {
  const d = await crypto.subtle.digest("SHA-256", te.encode(META.pepper + ":" + id));
  return u2b(new Uint8Array(d));
}
async function unwrap(id, password) {
  const h = await slotHash(id);
  const slot = META.slots.find(s => s.h === h);
  const base = await crypto.subtle.importKey("raw", te.encode(password), "PBKDF2", false, ["deriveKey"]);
  const salt = slot ? b2u(slot.salt) : crypto.getRandomValues(new Uint8Array(16));
  const k = await crypto.subtle.deriveKey({ name: "PBKDF2", hash: "SHA-256", salt, iterations: META.iter }, base, { name: "AES-GCM", length: 256 }, false, ["decrypt"]);
  if (!slot) throw new Error("nope"); // same work either way: no timing hint about which names exist
  const inner = JSON.parse(td.decode(await crypto.subtle.decrypt({ name: "AES-GCM", iv: b2u(slot.iv) }, k, b2u(slot.w))));
  return inner; // {k, id, admin}
}
async function openPayload(rawKeyB64) {
  const key = await crypto.subtle.importKey("raw", b2u(rawKeyB64), "AES-GCM", false, ["decrypt"]);
  const ct = b2u($("#payload").textContent.trim());
  return JSON.parse(td.decode(await crypto.subtle.decrypt({ name: "AES-GCM", iv: b2u(META.iv) }, key, ct)));
}

const form = $("#login"), err = $("#err"), go = $("#go");
form.addEventListener("submit", async (e) => {
  e.preventDefault(); err.textContent = "";
  if (!window.crypto || !crypto.subtle) { err.textContent = "This browser can't decrypt the portal. Please use a current browser."; return; }
  go.disabled = true; go.innerHTML = '<span class="spin"></span><span>Decrypting…</span>';
  try {
    const inner = await unwrap(loginId($("#user").value), $("#pass").value);
    const data = await openPayload(inner.k);
    try { sessionStorage.setItem(SKEY, JSON.stringify(inner)); } catch {}
    start(data, inner);
  } catch {
    err.textContent = "That name and password don't match. Check with your mentor if you're stuck.";
    $(".gate-card").classList.remove("shake"); void $(".gate-card").offsetWidth; $(".gate-card").classList.add("shake");
    go.disabled = false; go.innerHTML = "<span>Unlock</span>";
  }
});
(async () => {
  try { const s = JSON.parse(sessionStorage.getItem(SKEY) || "null"); if (s && s.k) start(await openPayload(s.k), s); } catch { sessionStorage.removeItem(SKEY); }
})();

  $("#out").onclick = () => { try { sessionStorage.removeItem(SKEY); } catch {} location.reload(); };

    lbl.innerHTML = `⏱️ Next up: <b>${esc(nx.title)}</b> · ${esc(when)} ET · ${esc(nx.where)}`;
    let s = Math.max(0, Math.floor((nx.t - now) / 1000));
    const u = [["days", 86400], ["hrs", 3600], ["min", 60], ["sec", 1]].map(([l, n]) => { const v = Math.floor(s / n); s -= v * n; return `<div class="u"><span class="n">${String(v).padStart(2, "0")}</span><span class="l">${l}</span></div>`; });
    c.innerHTML = u.join("");
  };
  tick(); setInterval(tick, 1000);

  // quiz

      $("#again").onclick = () => { qi = 0; score = 0; renderQ(); };
      if (score >= 4) confetti();
      return;

    qz.innerHTML = `<div class="qhead"><span>🧩 Quick quiz · ${qi + 1} of ${Q.length}</span><span class="dots">${Q.map((_, i) => `<i class="${i < qi ? "on" : ""}"></i>`).join("")}</span></div>

      $("#nextq").onclick = () => { qi++; renderQ(); };
    });
  };
  renderQ();

  function confetti() {
    const cols = ["#A3231B", "#d23a2e", "#f2b544", "#39c3b0", "#4f8cff", "#fff"];
    for (let i = 0; i < 70; i++) {
      const p = document.createElement("i"); p.className = "confetti";
      p.style.left = Math.random() * 100 + "vw"; p.style.background = cols[i % cols.length];
      p.style.animationDuration = 1.8 + Math.random() * 1.8 + "s"; p.style.animationDelay = Math.random() * .4 + "s";

  const t = $("#toast"); t.textContent = who.admin ? "Admin view unlocked 🛡️" : `Access granted. Welcome, ${me.first}! 🚀`;
  setTimeout(() => t.classList.add("show"), 300); setTimeout(() => t.classList.remove("show"), 3200);
}
